# Publishes the static UI (frontend/) to GitHub Pages.
# GitHub Pages can only host static files, so the Python API must run somewhere else
# (Codespaces, Render, Railway, Fly.io, your own server …). Set the repository variable
# RELAYDROP_API_URL (Settings ▸ Secrets and variables ▸ Actions ▸ Variables) to that API's https URL,
# and set CORS_ORIGINS=https://<you>.github.io on the API.
name: Deploy UI to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Point the UI at the API
        env: { API: "${{ vars.RELAYDROP_API_URL }}" }
        run: |
          printf 'window.RELAYDROP_CONFIG = { apiBase: %s };\n' "$(python3 -c 'import json,os;print(json.dumps(os.environ.get("API","").rstrip("/")))')" > frontend/js/config.js
          touch frontend/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend }
      - id: deploy
        uses: actions/deploy-pages@v4
