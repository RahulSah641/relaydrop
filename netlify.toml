# Netlify hosts the static UI (frontend/). The Python API must run elsewhere (see render.yaml / Dockerfile).
# In Netlify: Site settings ▸ Environment variables ▸ RELAYDROP_API_URL = https://your-api.onrender.com
[build]
  publish = "frontend"
  command = "printf 'window.RELAYDROP_CONFIG = { apiBase: \"%s\" };\\n' \"${RELAYDROP_API_URL%/}\" > frontend/js/config.js"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/js/config.js"
  [headers.values]
    Cache-Control = "no-cache"
